name: Build XFive Live

on:
  push:
  workflow_dispatch:

# Keep only the newest build for this branch/workflow.
# A newer commit cancels an older running build and replaces the pending one.
concurrency:
  group: xfive-live-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # BELUM DIVERIFIKASI: sesuaikan dengan versi Gradle yang dibutuhkan Fabric Loom 26.x.
          gradle-version: "9.8.2"

      - name: Build mod jar
        run: gradle build --no-daemon

      - name: Read mod version
        id: ver
        run: echo "v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: XFiveLive-${{ steps.ver.outputs.v }}
          path: build/libs/*.jar
